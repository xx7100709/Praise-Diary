<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>讚美手帳</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #FFFFFF;
      color: #111111;
      padding-bottom: 80px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 500px;
      padding: 20px 20px 80px 20px;
    }

    /* 頂部標題與日期 */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 2px solid #111;
      margin-bottom: 25px;
    }
    .header-title { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
    .date-badge {
      background: #F4F4F0;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    /* 區塊標籤 */
    .section-label {
      font-size: 12px;
      font-weight: 800;
      color: #8E8E93;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    /* 黑色線條 Icon 萬用容器 */
    .line-icon {
      width: 18px;
      height: 18px;
      stroke: #111111;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      display: inline-block;
      vertical-align: middle;
      pointer-events: none;
    }

    /* 心情選擇區塊 */
    .mood-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 25px;
    }
    .mood-btn {
      background: #F4F4F0;
      border: 1.5px solid transparent;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
      color: #111;
      position: relative;
      z-index: 10;
      user-select: none;
    }
    .mood-btn * { pointer-events: none; }
    .mood-btn.active {
      background: #FFD0D0;
      border-color: #111;
    }

    /* 文字輸入框 */
    textarea {
      width: 100%;
      height: 180px;
      border: 1.5px solid #E5E5EA;
      border-radius: 16px;
      padding: 16px;
      font-size: 16px;
      outline: none;
      resize: none;
      font-family: inherit;
      margin-bottom: 25px;
    }
    textarea:focus { border-color: #111; }

    /* 黑色主要按鈕 */
    .btn-submit {
      width: 100%;
      background: #111111;
      color: #FFFFFF;
      border: none;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      position: relative;
      z-index: 10;
    }
    .btn-submit:active { opacity: 0.85; }

    /* 頁面分頁控制 */
    .page { display: none; }
    .page.active { display: block; }

    /* --- 月曆頁面樣式 --- */
    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .cal-title { font-size: 22px; font-weight: 800; }
    .cal-nav {
      font-size: 20px;
      cursor: pointer;
      padding: 5px 12px;
      font-weight: bold;
      user-select: none;
      position: relative;
      z-index: 10;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin-bottom: 30px;
    }
    .cal-day-cell {
      aspect-ratio: 1;
      background: #F8F8FA;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      border: 1.5px solid transparent;
      user-select: none;
      position: relative;
      z-index: 10;
    }
    .cal-day-cell * { pointer-events: none; }
    .cal-day-cell.active {
      background: #FFD0D0;
      border-color: #111;
    }
    .cal-day-cell .mood-indicator { margin-top: 3px; }

    /* 月曆下的日記紀錄列表 */
    .review-title {
      font-size: 14px;
      font-weight: 800;
      color: #8E8E93;
      margin-bottom: 15px;
    }
    .review-card {
      background: #FFFFFF;
      border: 1.5px solid #E5E5EA;
      border-left: 5px solid #FFD0D0;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .review-mood { display: flex; align-items: center; gap: 6px; font-weight: 800; margin-bottom: 6px; }
    .review-content { font-size: 15px; font-weight: 700; color: #111; line-height: 1.4; }

    /* 底部導覽 TabBar */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: #FFFFFF;
      border-top: 1px solid #E5E5EA;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #8E8E93;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      width: 50%;
      height: 100%;
      justify-content: center;
    }
    .tab-item * { pointer-events: none; }
    .tab-item.active { color: #111111; }
    .tab-item.active .line-icon { stroke: #111111; }
    .tab-item:not(.active) .line-icon { stroke: #8E8E93; }
    .tab-icon { margin-bottom: 4px; }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- 頁面 1: 讚美手帳 -->
    <div id="pageHandbook" class="page active">
      <div class="header-bar">
        <div class="header-title">讚美手帳</div>
        <div class="date-badge" id="currentTodayDate">2026/08/24 ▾</div>
      </div>

      <div class="section-label">SELECT MOOD</div>
      <div class="mood-grid">
        <button class="mood-btn active" data-mood="愉快" onclick="selectMood(this)">
          <svg class="line-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          愉快
        </button>
        <button class="mood-btn" data-mood="平靜" onclick="selectMood(this)">
          <svg class="line-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="8" y1="15" x2="16" y2="15"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          平靜
        </button>
        <button class="mood-btn" data-mood="充實" onclick="selectMood(this)">
          <svg class="line-icon" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          充實
        </button>
        <button class="mood-btn" data-mood="感恩" onclick="selectMood(this)">
          <svg class="line-icon" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          感恩
        </button>
        <button class="mood-btn" data-mood="自信" onclick="selectMood(this)">
          <svg class="line-icon" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          自信
        </button>
      </div>

      <div class="section-label">YOUR PRAISE</div>
      <textarea id="praiseInput" placeholder="寫下今天對自己的讚美..."></textarea>

      <button class="btn-submit" onclick="submitPraise()">儲存讚美</button>
    </div>

    <!-- 頁面 2: 情緒月曆 -->
    <div id="pageCalendar" class="page">
      <div class="cal-header">
        <div class="cal-nav" onclick="changeMonth(-1)">&lt;</div>
        <div class="cal-title" id="calMonthTitle">2026年8月</div>
        <div class="cal-nav" onclick="changeMonth(1)">&gt;</div>
      </div>

      <div class="calendar-grid" id="calendarGrid"></div>

      <div class="review-title" id="selectedDateLabel">8/24 讚美回顧</div>
      <div id="reviewList"></div>
    </div>

  </div>

  <!-- 底部選單 Tab Bar -->
  <div class="tab-bar">
    <div class="tab-item active" id="tab1" onclick="switchTab('handbook')">
      <div class="tab-icon">
        <svg class="line-icon" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      </div>
      <div>讚美手帳</div>
    </div>
    <div class="tab-item" id="tab2" onclick="switchTab('calendar')">
      <div class="tab-icon">
        <svg class="line-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </div>
      <div>情緒月曆</div>
    </div>
  </div>

  <script>
    // 請填入你的 Supabase 設定
    const SUPABASE_URL = 'https://kfhviyqgrfycmbhuotru.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtmaHZpeXFncmZ5Y21iaHVvdHJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0ODM4NDUsImV4cCI6MjEwMzA1OTg0NX0.TCGksnMy7SCLmI8LxtwhhAnJaQ7vZhmid4M2poOxjBY';
    
    let supabaseClient = null;
    
    // 初始化 Supabase 避免變數名稱衝突
    if (typeof window.supabase !== 'undefined' && SUPABASE_URL !== 'YOUR_SUPABASE_URL') {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    let selectedMoodText = '愉快';
    let currentYear = 2026;
    let currentMonth = 7; // 0-indexed (7 表示 8月)
    let selectedDay = 24;
    let allEntries = [];

    // 線條風格 SVG Icon 對照表
    const moodIcons = {
      '愉快': `<svg class="line-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>`,
      '平靜': `<svg class="line-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="8" y1="15" x2="16" y2="15"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>`,
      '充實': `<svg class="line-icon" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`,
      '感恩': `<svg class="line-icon" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`,
      '自信': `<svg class="line-icon" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`
    };

    window.onload = function() {
      const now = new Date();
      currentYear = now.getFullYear();
      currentMonth = now.getMonth();
      selectedDay = now.getDate();

      const dateStr = `${currentYear}/${String(currentMonth + 1).padStart(2, '0')}/${String(selectedDay).padStart(2, '0')}`;
      document.getElementById('currentTodayDate').innerText = dateStr + ' ▾';
      
      if (supabaseClient) {
        fetchEntries();
      } else {
        renderCalendar();
      }
    };

    function selectMood(btn) {
      document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedMoodText = btn.getAttribute('data-mood');
    }

    function switchTab(tabName) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));

      if (tabName === 'handbook') {
        document.getElementById('pageHandbook').classList.add('active');
        document.getElementById('tab1').classList.add('active');
      } else {
        document.getElementById('pageCalendar').classList.add('active');
        document.getElementById('tab2').classList.add('active');
        renderCalendar();
      }
    }

    async function fetchEntries() {
      if (!supabaseClient) return;
      const { data, error } = await supabaseClient
        .from('praise_diaries')
        .select('*')
        .order('created_at', { ascending: false });

      if (!error && data) {
        allEntries = data;
        renderCalendar();
      }
    }

    async function submitPraise() {
      const text = document.getElementById('praiseInput').value.trim();
      if (!text) {
        alert('寫下今天對自己的讚美吧！');
        return;
      }

      if (!supabaseClient) {
        alert('請先於程式碼中設定正確的 SUPABASE_URL 與 SUPABASE_ANON_KEY！');
        return;
      }

      const { error } = await supabaseClient
        .from('praise_diaries')
        .insert([{ content: text, mood: selectedMoodText }]);

      if (error) {
        alert('儲存失敗：' + error.message);
      } else {
        document.getElementById('praiseInput').value = '';
        alert('儲存成功！');
        await fetchEntries();
        switchTab('calendar');
      }
    }

    function renderCalendar() {
      document.getElementById('calMonthTitle').innerText = `${currentYear}年${currentMonth + 1}月`;
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

      for (let day = 1; day <= daysInMonth; day++) {
        const cell = document.createElement('div');
        cell.className = 'cal-day-cell' + (day === selectedDay ? ' active' : '');
        cell.onclick = function() { selectCalDay(day); };

        const hasEntry = allEntries.find(e => {
          const d = new Date(e.created_at);
          return d.getFullYear() === currentYear && d.getMonth() === currentMonth && d.getDate() === day;
        });

        cell.innerHTML = `<div>${day}</div>`;
        if (hasEntry && hasEntry.mood && moodIcons[hasEntry.mood]) {
          cell.innerHTML += `<div class="mood-indicator">${moodIcons[hasEntry.mood]}</div>`;
        }

        grid.appendChild(cell);
      }

      renderReviews();
    }

    function selectCalDay(day) {
      selectedDay = day;
      renderCalendar();
    }

    function changeMonth(delta) {
      currentMonth += delta;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      renderCalendar();
    }

    function renderReviews() {
      document.getElementById('selectedDateLabel').innerText = `${currentMonth + 1}/${selectedDay} 讚美回顧`;
      const list = document.getElementById('reviewList');
      list.innerHTML = '';

      const dayEntries = allEntries.filter(e => {
        const d = new Date(e.created_at);
        return d.getFullYear() === currentYear && d.getMonth() === currentMonth && d.getDate() === selectedDay;
      });

      if (dayEntries.length === 0) {
        list.innerHTML = '<div style="color:#8E8E93; font-size:14px;">這天還沒有寫下讚美喔～</div>';
        return;
      }

      dayEntries.forEach(item => {
        const iconSvg = moodIcons[item.mood] || moodIcons['愉快'];
        const card = document.createElement('div');
        card.className = 'review-card';
        card.innerHTML = `
          <div class="review-mood">${iconSvg} <span>${item.mood || '讚美'}</span></div>
          <div class="review-content">${escapeHtml(item.content)}</div>
        `;
        list.appendChild(card);
      });
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
