<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>讚美日記</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #F4F4F0;
      --card-bg: #FFFFFF;
      --text: #111111;
      --text-muted: #666666;
      --border: #111111;
      --accent-red: #FF3B30;
      --accent-yellow: #FFCC00;
      --accent-blue: #007AFF;
      --accent-green: #34C759;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 0;
      margin: 0;
      display: flex;
      justify-content: center;
    }

    /* 頂部 Swiss 風格繽紛 Color Bar */
    .color-bar {
      display: flex;
      height: 8px;
      width: 100%;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
    }
    .color-bar div { flex: 1; }
    .bar-1 { background-color: var(--accent-red); }
    .bar-2 { background-color: var(--accent-yellow); }
    .bar-3 { background-color: var(--accent-blue); }
    .bar-4 { background-color: var(--accent-green); }

    .container {
      width: 100%;
      max-width: 600px;
      padding: 40px 20px 20px 20px;
    }

    /* Swiss Style 大膽黑體 Header */
    .header {
      border-bottom: 4px solid var(--border);
      padding-bottom: 15px;
      margin-bottom: 25px;
    }
    .header h1 {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -1px;
      text-transform: uppercase;
    }
    .header p {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 5px;
      font-weight: 600;
    }

    /* 瑞士月曆區塊 (Calendar Bar) */
    .swiss-calendar {
      background: var(--card-bg);
      border: 3px solid var(--border);
      padding: 15px;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 4px 4px 0px var(--border);
    }
    .cal-left {
      display: flex;
      flex-direction: column;
    }
    .cal-month {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--accent-red);
      letter-spacing: 1px;
    }
    .cal-day {
      font-size: 36px;
      font-weight: 900;
      line-height: 1;
    }
    .cal-right {
      text-align: right;
    }
    .cal-weekday {
      font-size: 18px;
      font-weight: 800;
      background: var(--text);
      color: var(--bg);
      padding: 4px 8px;
      display: inline-block;
    }

    /* 輸入卡片區塊 */
    .input-card {
      background: var(--card-bg);
      border: 3px solid var(--border);
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 4px 4px 0px var(--border);
    }
    textarea {
      width: 100%;
      height: 90px;
      border: 2px solid var(--border);
      padding: 12px;
      font-size: 16px;
      font-weight: 500;
      outline: none;
      resize: none;
      font-family: inherit;
    }
    textarea:focus {
      background-color: #FAF9F5;
    }
    button {
      width: 100%;
      background: var(--text);
      color: var(--bg);
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      margin-top: 12px;
      transition: all 0.1s ease;
    }
    button:hover {
      background: var(--accent-blue);
      color: #FFF;
    }
    button:active {
      transform: translate(2px, 2px);
    }

    /* 歷史條目區塊 */
    .entry-card {
      background: var(--card-bg);
      border: 3px solid var(--border);
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 4px 4px 0px var(--border);
      position: relative;
    }
    .entry-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6px;
      background-color: var(--accent-blue);
    }
    .entry-date {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-muted);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
    .entry-content {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.5;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <!-- 頂部多色 Color Bar -->
  <div class="color-bar">
    <div class="bar-1"></div>
    <div class="bar-2"></div>
    <div class="bar-3"></div>
    <div class="bar-4"></div>
  </div>

  <div class="container">
    <div class="header">
      <h1>PRAISE DIARY.</h1>
      <p>每天肯定自己一點點／累積好心情</p>
    </div>

    <!-- 瑞士風格月曆 Bar -->
    <div class="swiss-calendar">
      <div class="cal-left">
        <span class="cal-month" id="calMonth">JANUARY</span>
        <span class="cal-day" id="calDay">01</span>
      </div>
      <div class="cal-right">
        <span class="cal-weekday" id="calWeekday">MON</span>
      </div>
    </div>

    <!-- 日記輸入卡片 -->
    <div class="input-card">
      <textarea id="diaryInput" placeholder="今天有哪些值得自我讚美的事呢？"></textarea>
      <button onclick="addEntry()">寫入讚美日記</button>
    </div>

    <!-- 歷史日記列表 -->
    <div id="entriesList"></div>
  </div>

  <script>
    // 填入你的 Supabase 設定
    const SUPABASE_URL = 'https://kfhviyqgrfycmbhuotru.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtmaHZpeXFncmZ5Y21iaHVvdHJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0ODM4NDUsImV4cCI6MjEwMzA1OTg0NX0.TCGksnMy7SCLmI8LxtwhhAnJaQ7vZhmid4M2poOxjBY';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.onload = function() {
      updateSwissCalendar();
      fetchEntries();
    };

    function updateSwissCalendar() {
      const now = new Date();
      const months = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];
      const weekdays = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];

      document.getElementById('calMonth').innerText = months[now.getMonth()];
      document.getElementById('calDay').innerText = String(now.getDate()).padStart(2, '0');
      document.getElementById('calWeekday').innerText = weekdays[now.getDay()];
    }

    async function fetchEntries() {
      const { data, error } = await supabase
        .from('praise_diaries')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('讀取失敗:', error);
        return;
      }

      const listDiv = document.getElementById('entriesList');
      listDiv.innerHTML = '';
      
      data.forEach(item => {
        const dateObj = new Date(item.created_at);
        const dateStr = `${dateObj.getFullYear()}.${String(dateObj.getMonth() + 1).padStart(2, '0')}.${String(dateObj.getDate()).padStart(2, '0')} ${String(dateObj.getHours()).padStart(2, '0')}:${String(dateObj.getMinutes()).padStart(2, '0')}`;
        
        const card = document.createElement('div');
        card.className = 'entry-card';
        card.innerHTML = `
          <div class="entry-date">${dateStr}</div>
          <div class="entry-content">${escapeHtml(item.content)}</div>
        `;
        listDiv.appendChild(card);
      });
    }

    async function addEntry() {
      const input = document.getElementById('diaryInput');
      const text = input.value.trim();
      
      if (!text) {
        alert('請輸入讚美自己的內容喔！');
        return;
      }

      const { data, error } = await supabase
        .from('praise_diaries')
        .insert([{ content: text }]);

      if (error) {
        alert('儲存失敗：' + error.message);
      } else {
        input.value = '';
        fetchEntries();
      }
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
